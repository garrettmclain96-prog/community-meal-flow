name: Fix server functions and about teaser

on:
  push:
    paths:
      - '.github/workflows/fix-serverfn-and-about-teaser.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch TanStack server functions and homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # TanStack Start in this repo exposes inputValidator(), not validator().
          for file in [
              Path('src/lib/chatgpt.functions.ts'),
              Path('src/lib/food/import.functions.ts'),
              Path('src/lib/payments.functions.ts'),
          ]:
              text = file.read_text()
              count = text.count('.validator(')
              if count == 0:
                  print(f'{file}: no legacy validators found')
                  continue
              text = text.replace('.validator(', '.inputValidator(')
              file.write_text(text)
              print(f'{file}: replaced {count} validator call(s)')

          index = Path('src/routes/index.tsx')
          text = index.read_text()
          if 'WHY PROVISIONLOOP?' not in text:
              marker = '''        <section className="pl-section pl-proof-section">'''
              teaser = '''        <section className="pl-section border-b-2 border-foreground">
          <div className="site-shell grid gap-10 lg:grid-cols-[1.1fr_.9fr] lg:items-end">
            <div>
              <p className="pl-section-kicker">Why ProvisionLoop?</p>
              <h2 className="pl-section-title">THE GAP ISN&apos;T GENEROSITY. IT&apos;S COORDINATION.</h2>
            </div>
            <div className="lg:justify-self-end">
              <p className="max-w-xl text-sm leading-7 opacity-70 md:text-base">
                Communities already have people willing to help, kitchens with usable capacity,
                organizations that understand local need and volunteers willing to move food. The
                failure point is what happens between those pieces. ProvisionLoop connects them into
                one accountable loop.
              </p>
              <Link
                to="/about"
                className="mt-5 inline-flex items-center gap-2 text-sm font-black text-primary"
              >
                Why ProvisionLoop exists <ArrowUpRight className="size-4" />
              </Link>
            </div>
          </div>
        </section>

'''
              if marker not in text:
                  raise SystemExit('homepage teaser marker not found')
              text = text.replace(marker, teaser + marker, 1)
              index.write_text(text)
              print('homepage: added Why ProvisionLoop teaser')
          else:
              print('homepage: teaser already present')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/chatgpt.functions.ts src/lib/food/import.functions.ts src/lib/payments.functions.ts src/routes/index.tsx
          git commit -m "fix: use current TanStack validators and surface about story"
          git push origin HEAD:main
