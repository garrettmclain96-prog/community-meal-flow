name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair known TanStack API drift
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for file in [
              Path('src/lib/chatgpt.functions.ts'),
              Path('src/lib/food/import.functions.ts'),
              Path('src/lib/payments.functions.ts'),
          ]:
              text = file.read_text()
              if '.validator(' in text:
                  file.write_text(text.replace('.validator(', '.inputValidator('))
                  changed.append(str(file))

          index = Path('src/routes/index.tsx')
          text = index.read_text()
          if 'THE GAP ISN&apos;T GENEROSITY. IT&apos;S COORDINATION.' not in text:
              marker = '        <section className="pl-section pl-proof-section">'
              teaser = '''        <section className="pl-section border-b-2 border-foreground">
          <div className="site-shell grid gap-10 lg:grid-cols-[1.1fr_.9fr] lg:items-end">
            <div>
              <p className="pl-section-kicker">Why ProvisionLoop?</p>
              <h2 className="pl-section-title">THE GAP ISN&apos;T GENEROSITY. IT&apos;S COORDINATION.</h2>
            </div>
            <div className="lg:justify-self-end">
              <p className="max-w-xl text-sm leading-7 opacity-70 md:text-base">
                Communities already have people willing to help, kitchens with usable capacity,
                organizations that understand local need and volunteers willing to move food. The
                failure point is what happens between those pieces. ProvisionLoop connects them into
                one accountable loop.
              </p>
              <Link
                to="/about"
                className="mt-5 inline-flex items-center gap-2 text-sm font-black text-primary"
              >
                Why ProvisionLoop exists <ArrowUpRight className="size-4" />
              </Link>
            </div>
          </div>
        </section>

'''
              if marker not in text:
                  raise SystemExit('Homepage insertion marker not found')
              index.write_text(text.replace(marker, teaser + marker, 1))
              changed.append(str(index))

          print('Repaired:', ', '.join(changed) if changed else 'nothing')
          PY

          if ! git diff --quiet -- src/lib/chatgpt.functions.ts src/lib/food/import.functions.ts src/lib/payments.functions.ts src/routes/index.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/chatgpt.functions.ts src/lib/food/import.functions.ts src/lib/payments.functions.ts src/routes/index.tsx
            git commit -m "fix: repair server validators and add about teaser"
            git push origin HEAD:main
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build / route generation
        run: bun run build

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report typecheck failure
        if: failure() && steps.typecheck.outputs.status != '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Automated release verification found TypeScript errors on commit $GITHUB_SHA."
            echo
            echo '```text'
            cat typecheck.log
            echo '```'
          } > ci-issue.md
          gh issue create --title "CI typecheck failure — ${GITHUB_SHA::7}" --body-file ci-issue.md --label "bug" || \
            gh issue create --title "CI typecheck failure — ${GITHUB_SHA::7}" --body-file ci-issue.md

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report lint failure
        if: failure() && steps.lint.outputs.status != '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Automated release verification found lint errors on commit $GITHUB_SHA."
            echo
            echo '```text'
            cat lint.log
            echo '```'
          } > ci-lint-issue.md
          gh issue create --title "CI lint failure — ${GITHUB_SHA::7}" --body-file ci-lint-issue.md --label "bug" || \
            gh issue create --title "CI lint failure — ${GITHUB_SHA::7}" --body-file ci-lint-issue.md

      - name: Tests
        run: bun run test
