name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build / route generation
        run: bun run build

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report typecheck failure
        if: failure() && steps.typecheck.outputs.status != '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Automated release verification found TypeScript errors on commit $GITHUB_SHA."
            echo
            echo '```text'
            cat typecheck.log
            echo '```'
          } > ci-issue.md
          gh issue create --title "CI typecheck failure — ${GITHUB_SHA::7}" --body-file ci-issue.md --label "bug" || \
            gh issue create --title "CI typecheck failure — ${GITHUB_SHA::7}" --body-file ci-issue.md

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test
