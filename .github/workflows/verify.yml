name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository line-count metrics
        shell: bash
        run: |
          set -euo pipefail

          total_lines=0
          total_files=0
          maintained_lines=0
          maintained_files=0
          app_lines=0
          app_files=0

          while IFS= read -r -d '' file; do
            [[ -f "$file" ]] || continue
            # Skip binary files. Empty files contribute zero lines either way.
            if [[ -s "$file" ]] && ! grep -Iq . "$file"; then
              continue
            fi

            lines=$(wc -l < "$file")
            total_lines=$((total_lines + lines))
            total_files=$((total_files + 1))

            case "$file" in
              package-lock.json|bun.lock|src/routeTree.gen.ts|src/integrations/supabase/types.ts|.lovable/*)
                ;;
              *)
                maintained_lines=$((maintained_lines + lines))
                maintained_files=$((maintained_files + 1))
                ;;
            esac

            case "$file" in
              src/*.ts|src/*.tsx|src/*.css|src/**/*.ts|src/**/*.tsx|src/**/*.css)
                case "$file" in
                  src/routeTree.gen.ts|src/integrations/supabase/types.ts)
                    ;;
                  *)
                    app_lines=$((app_lines + lines))
                    app_files=$((app_files + 1))
                    ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)

          echo "TOTAL_TRACKED_TEXT_FILES=$total_files"
          echo "TOTAL_TRACKED_TEXT_LINES=$total_lines"
          echo "MAINTAINED_TEXT_FILES=$maintained_files"
          echo "MAINTAINED_TEXT_LINES=$maintained_lines"
          echo "APP_SOURCE_FILES=$app_files"
          echo "APP_SOURCE_LINES=$app_lines"

          {
            echo "### Repository line-count metrics"
            echo
            echo "| Metric | Files | Lines |"
            echo "| --- | ---: | ---: |"
            echo "| All tracked text | $total_files | $total_lines |"
            echo "| Maintained text (excludes lockfiles, generated Supabase types/route tree, and legacy .lovable plans) | $maintained_files | $maintained_lines |"
            echo "| App source under src/ (excludes generated route tree/types) | $app_files | $app_lines |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (migration PR)
        if: github.event_name == 'pull_request' && github.head_ref == 'de-lovable-control'
        run: bun install

      - name: Install dependencies (locked)
        if: github.event_name != 'pull_request' || github.head_ref != 'de-lovable-control'
        run: bun install --frozen-lockfile

      - name: Production build / route generation
        run: bun run build

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report typecheck failure
        if: failure() && steps.typecheck.outputs.status != '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Automated release verification found TypeScript errors on commit $GITHUB_SHA."
            echo
            echo '```text'
            cat typecheck.log
            echo '```'
          } > ci-issue.md
          gh issue create --title "CI typecheck failure — ${GITHUB_SHA::7}" --body-file ci-issue.md --label "bug" || \
            gh issue create --title "CI typecheck failure — ${GITHUB_SHA::7}" --body-file ci-issue.md

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report lint failure
        if: failure() && steps.lint.outputs.status != '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Automated release verification found lint errors on commit $GITHUB_SHA."
            echo
            echo '```text'
            cat lint.log
            echo '```'
          } > ci-lint-issue.md
          gh issue create --title "CI lint failure — ${GITHUB_SHA::7}" --body-file ci-lint-issue.md --label "bug" || \
            gh issue create --title "CI lint failure — ${GITHUB_SHA::7}" --body-file ci-lint-issue.md

      - name: Tests
        id: tests
        shell: bash
        run: |
          set +e
          bun run test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report test failure
        if: failure() && steps.tests.outputs.status != '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Automated release verification found failing tests on commit $GITHUB_SHA."
            echo
            echo '```text'
            cat test.log
            echo '```'
          } > ci-test-issue.md
          gh issue create --title "CI test failure — ${GITHUB_SHA::7}" --body-file ci-test-issue.md --label "bug" || \
            gh issue create --title "CI test failure — ${GITHUB_SHA::7}" --body-file ci-test-issue.md
