name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  issues: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair known API drift
        shell: bash
        run: |
          node scripts/release-repair.mjs
          if [ "$GITHUB_EVENT_NAME" = "push" ] && ! git diff --quiet -- src/lib/chatgpt.functions.ts src/lib/food/import.functions.ts src/lib/payments.functions.ts src/routes/index.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/chatgpt.functions.ts src/lib/food/import.functions.ts src/lib/payments.functions.ts src/routes/index.tsx
            git commit -m "fix: repair server validators and add about teaser"
            git push origin HEAD:main
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build / route generation
        run: bun run build

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          bun run typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report typecheck failure
        if: failure() && steps.typecheck.outputs.status != '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Automated release verification found TypeScript errors on commit $GITHUB_SHA."
            echo
            echo '```text'
            cat typecheck.log
            echo '```'
          } > ci-issue.md
          gh issue create --title "CI typecheck failure — ${GITHUB_SHA::7}" --body-file ci-issue.md --label "bug" || \
            gh issue create --title "CI typecheck failure — ${GITHUB_SHA::7}" --body-file ci-issue.md

      - name: Lint
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Report lint failure
        if: failure() && steps.lint.outputs.status != '0' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Automated release verification found lint errors on commit $GITHUB_SHA."
            echo
            echo '```text'
            cat lint.log
            echo '```'
          } > ci-lint-issue.md
          gh issue create --title "CI lint failure — ${GITHUB_SHA::7}" --body-file ci-lint-issue.md --label "bug" || \
            gh issue create --title "CI lint failure — ${GITHUB_SHA::7}" --body-file ci-lint-issue.md

      - name: Tests
        run: bun run test
