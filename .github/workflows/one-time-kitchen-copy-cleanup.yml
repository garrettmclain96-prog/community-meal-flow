name: One-time kitchen copy cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-kitchen-copy-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove inaccurate kitchen claim and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/kitchen.tsx')
          s = p.read_text()
          old = 'Restaurants, food trucks and community kitchens register capacity, post meal templates, accept funded orders and track guaranteed revenue.'
          new = 'Restaurants, food trucks and community kitchens register capacity, complete verification, publish meal availability, fulfill funded orders and track verified payouts.'
          if old not in s:
              raise SystemExit('Expected stale kitchen description was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/one-time-kitchen-copy-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/kitchen.tsx .github/workflows/one-time-kitchen-copy-cleanup.yml
          git commit -m "copy: make kitchen operations claims accurate"
          git push origin HEAD:main
